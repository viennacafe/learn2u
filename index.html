      // 리모컨으로 열었을 때(?app=remote, 또는 PC의 QR로 열린 #r=… 주소)는 홈 화면 설치용 정보(매니페스트·아이콘·이름·테마색)를
      // 리모컨 전용으로 바꾼다 — 그래야 QR로 연 페이지에서 "앱 설치"를 눌러도 PC 앱이 아니라 리모컨이 설치된다.
      // 브라우저가 매니페스트를 읽기 전에 실행되도록 <head>에서 바로 바꾼다.
      if (/[?&]app=remote/.test(location.search) || /[#&]r=/.test(location.hash)) {
        document.querySelector('link[rel="manifest"]').setAttribute('href', 'remote.webmanifest');
                document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', 'icons/icon-remote-192.png');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#3F3F3F');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', '리모컨');
        document.title = '강의 리모컨';
      }
